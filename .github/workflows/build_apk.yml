name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android SDK 36 & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Clean Project
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK (Obfuscated)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" --dart-define=LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" --dart-define=ADMIN_PASSCODE="${{ secrets.ADMIN_PASSCODE }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: act-like-it-apk
          path: build/app/outputs/flutter-apk/app-release.apk
