name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android Platform & S26 Ultra Permissions
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create --platforms=android --org com.actlikeit --project-name act_like_it .
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          fi
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Force compileSdk 34 for AndroidX
        run: |
          for cache_dir in "/home/runner/.pub-cache/hosted" "${PUB_CACHE}/hosted"; do
            if [ -d "$cache_dir" ]; then
              find "$cache_dir" \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
                -e 's/compileSdkVersion 31/compileSdkVersion 34/g' \
                -e 's/compileSdkVersion 32/compileSdkVersion 34/g' \
                -e 's/compileSdkVersion 33/compileSdkVersion 34/g' \
                -e 's/compileSdk 31/compileSdk 34/g' \
                -e 's/compileSdk 32/compileSdk 34/g' \
                -e 's/compileSdk 33/compileSdk 34/g' \
                -e 's/compileSdk = 31/compileSdk = 34/g' \
                -e 's/compileSdk = 32/compileSdk = 34/g' \
                -e 's/compileSdk = 33/compileSdk = 34/g' {} +
            fi
          done

      - name: Build Release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" --dart-define=LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: act-like-it-apk
          path: build/app/outputs/flutter-apk/app-release.apk
